name: fitoreport_app
description: Application create fitosanitary reports.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  get_it: ^8.0.3
  http: ^1.4.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  mobile_scanner: ^6.0.5
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  font_awesome_flutter: ^10.8.0
  pdf: ^3.11.1
  printing: ^5.14.2
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_launcher_icons: "^0.14.3"
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_test:
    sdk: flutter

flutter_icons:
  image_path: "assets/icon/iconC.jpg"
  adaptive_icon_foreground: "assets/icon/iconC.jpg"
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/uni.png
    - assets/icon/cuida.jpg
